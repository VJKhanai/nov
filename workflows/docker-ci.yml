name:Build and push
on:
  push:
     branches:[main]
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
        name: Sign in to docker hub
        uses: docker/login-action@4
        with:
          username: Vijay18k
          password: $({GIT_TOKEN})
        name: Build and push the image
        uses: docker/build-push-action@v7
        with: 
           push: true
           tags: Vijay18k/nov:latest
